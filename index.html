<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>LunaEdge EA</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#1e293b;
padding:15px;
margin-bottom:15px;
border-radius:12px;
}

.buy{
color:#22c55e;
font-weight:bold;
}

.sell{
color:#ef4444;
font-weight:bold;
}
</style>
</head>

<body>

<h1>LunaEdge EA</h1>
<p>Powered by Equity Edge Scanner</p>

<div id="signals"></div>

<script>

const SUPABASE_URL =
https://fkqhprzazedjfjreuswa.supabase.co

const SUPABASE_KEY =
sb_publishable_qwQ6jT-Mq-YII5C3F2fPUQ_-gYJ3hTF

const client = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadSignals(){

const { data, error } =
await client
.from('signals')
.select('*')
.order('created_at', {
ascending:false
});

const container =
document.getElementById('signals');

container.innerHTML='';

data.forEach(signal=>{

container.innerHTML += `
<div class="card">

<h2>
${signal.symbol}
</h2>

<p class="${
signal.direction==='BUY'
? 'buy'
: 'sell'
}">
${signal.direction}
</p>

<p>
Confidence:
${signal.confidence}%
</p>

<p>
Entry:
${signal.entry_price}
</p>

<p>
SL:
${signal.stop_loss}
</p>

<p>
TP:
${signal.take_profit}
</p>

</div>
`;

});

}

loadSignals();

</script>

</body>
</html>
